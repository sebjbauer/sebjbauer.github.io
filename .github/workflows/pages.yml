# Builds and publishes the website on every push to main:
#   1. compiles the CV (cv/cv.tex → cv.pdf, downloadable at /cv.pdf)
#   2. reads the CV into cv-data.js (career, education, publications, talks, ... on the website)
#      and looks up where the co-authors of those papers are (coauthors.json, for the map)
#   3. builds the site with Jekyll, exactly like GitHub Pages does (respects _config.yml)
#   4. publishes everything together
name: Build and publish the website

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab
  schedule:
    - cron: '0 5 * * 1' # every Monday morning, so new co-authors in OpenAlex show up on the map

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv

      - name: WebP copies of the photos (a third smaller)
        run: | # never fails the build: without cwebp the site just uses the originals
          (sudo apt-get update -qq && sudo apt-get install -y -qq webp) > /dev/null 2>&1 || true
          if command -v cwebp > /dev/null; then
            for f in images/pubs/*.jpg images/pubs/*.jpeg images/pubs/*.png; do
              [ -f "$f" ] && cwebp -quiet -q 80 -m 6 "$f" -o "${f%.*}.webp" || true
            done
          fi

      - name: Read the CV into website data
        run: python3 cv/tex2web.py

      - name: Find where the co-authors are (OpenAlex)
        run: python3 cv/coauthors.py # never fails the build: without OpenAlex the map just stays hidden

      - name: Build the site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add the CV PDF and the CV data to the site
        run: |
          sudo cp cv/cv.pdf _site/cv.pdf
          # Jekyll skips files listed in .gitignore, so the generated CV data is copied in by hand
          sudo cp cv-data.js _site/cv-data.js
          if [ -s coauthors.json ]; then sudo cp coauthors.json _site/coauthors.json; fi
          test -s _site/cv-data.js && test -s _site/cv.pdf
          # a new version number for the CV data on every push, so phones don't keep an old copy
          sudo sed -i "s/cv-data.js?v=[A-Za-z0-9]*/cv-data.js?v=${GITHUB_SHA::8}/" _site/index.html
          # the date of this commit, for "Last updated" in the footer (so the page needn't ask GitHub's API)
          sudo sed -i "s/data-built=\"\"/data-built=\"$(git log -1 --format=%cI)\"/" _site/index.html

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
